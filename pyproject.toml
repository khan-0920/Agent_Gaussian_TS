[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-ts-agent"
version = "0.1.0"
description = "Gaussian transition-state problem framing and scientific tools for Codex and GPT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
gaussian-ts = "gaussian_ts.cli:main"

[tool.setuptools.packages.find]
include = ["gaussian_ts*"]
